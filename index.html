<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum DOM dan Event Handling</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Praktikum JavaScript DOM & Event Handling</h1>

  <!-- Latihan 1 & 2: Ubah Teks & Event Click -->
  <section class="card">
    <h2 id="judul">Latihan DOM</h2>
    <p id="pesan">Belum ada tindakan.</p>
    <button id="tombolAksi" type="button">Klik Saya</button>
  </section>

  <!-- Latihan 3: Mengubah Kelas & Gaya CSS -->
  <section class="card">
    <h2>Latihan 3: Ubah Gaya CSS</h2>
    <p id="teksGaya">Paragraf ini akan berubah gaya dan ukurannya.</p>
    <button id="tombolGaya" type="button">Toggle Highlight & Ukuran Teks</button>
  </section>

  <!-- Latihan 4: Event Input & Penghitung Karakter -->
  <section class="card">
    <h2>Latihan 4: Penghitung Karakter</h2>
    <label for="namaInput">Nama (Maks. 40 karakter):</label><br>
    <input type="text" id="namaInput" maxlength="40" placeholder="Ketik nama di sini...">
    <p>Jumlah karakter: <span id="jumlahKarakter">0</span> / 40</p>
  </section>

  <!-- Latihan 5 & Mini Project: Form Pendaftaran Workshop -->
  <section class="card">
    <h2>Form Pendaftaran Workshop (Latihan 5 & Mini Project)</h2>
    <form id="formPendaftaran" novalidate>
      <div>
        <label for="nama">Nama Lengkap (Min. 3 karakter):</label><br>
        <input id="nama" name="nama" type="text" placeholder="Masukkan nama lengkap">
      </div>
      <div>
        <label for="email">Email:</label><br>
        <input id="email" name="email" type="email" placeholder="contoh@domain.com">
      </div>
      <div>
        <label for="usia">Usia (17 - 100):</label><br>
        <input id="usia" name="usia" type="number" min="17" max="100" placeholder="Contoh: 20">
      </div>
      <div>
        <label for="sesi">Pilih Sesi Workshop:</label><br>
        <select id="sesi" name="sesi">
          <option value="">-- Pilih Sesi --</option>
          <option value="Pagi - Web Development">Pagi - Web Development</option>
          <option value="Siang - Data Science">Siang - Data Science</option>
          <option value="Malam - UI/UX Design">Malam - UI/UX Design</option>
        </select>
        <p id="infoSesi" class="info-text"></p>
      </div>
      <div style="margin-top: 10px;">
        <button type="submit">Daftar Workshop</button>
        <button type="reset" id="tombolReset">Reset Form</button>
      </div>
    </form>
    <p id="pesanForm" aria-live="polite"></p>
  </section>

  <!-- Latihan 6 & Eksperimen Mandiri: To-do List -->
  <section class="card">
    <h2>Daftar Tugas (To-Do List)</h2>
    <label for="inputTugas">Tugas baru:</label>
    <input id="inputTugas" type="text" placeholder="Tuliskan tugas...">
    <button id="tambahTugas" type="button">Tambah</button>
    <p id="pesanTugas" aria-live="polite"></p>
    <ul id="daftarTugas"></ul>
  </section>
</body>
</html>
